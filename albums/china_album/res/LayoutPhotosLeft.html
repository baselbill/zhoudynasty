<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Layout</title>
	<style>
		body {
			background-image: url(LayoutPhotosLeftBg.png);
			background-repeat: repeat-y;
			background-position: right;
			background-attachment: fixed;
			
			overflow: hidden;
		}
		.imgDIVTop {
			position: absolute;
			top: 0px;
			right: 0px;
		}
		.imgDIVBottom {
			position: absolute;
			bottom: 0px;
			right: 0px;
		}
	</style>
</head>

<body>
<div class="imgDIVTop"><img src="LayoutPhotosLeftAddTop.png" width="10" height="5" alt="" border="0"></div>
<div class="imgDIVBottom"><img src="LayoutPhotosLeftAddBottom.png" width="10" height="5" alt="" border="0"></div>
</body>
</html>
