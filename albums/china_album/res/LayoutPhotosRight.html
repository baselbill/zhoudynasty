<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Layout</title>
	<style>
		body {
			background-image: url(LayoutPhotosRightBg.png);
			background-repeat: repeat-y;
			background-position: left;
			background-attachment: fixed;
			
			overflow: hidden;
		}
		.imgDIVTop {
			position: absolute;
			top: 0px;
			left: 0px;
		}
		.imgDIVBottom {
			position: absolute;
			bottom: 0px;
			left: 0px;
		}
	</style>
</head>

<body>
<div class="imgDIVTop"><img src="LayoutPhotosRightAddTop.png" width="10" height="5" alt="" border="0"></div>
<div class="imgDIVBottom"><img src="LayoutPhotosRightAddBottom.png" width="10" height="5" alt="" border="0"></div>

</body>
</html>
