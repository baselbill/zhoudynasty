<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Layout</title>
	<style>
		body {
			background-image: url(LayoutTopMiddleBg.png);
			background-repeat: repeat-x;
			background-position: bottom;
			background-attachment: fixed;
			
			overflow: hidden;
		}
		.imgDIVLeft {
			position: absolute;
			bottom: 0px;
			left: 0px;
		}
		.imgDIVRight {
			position: absolute;
			bottom: 0px;
			right: 0px;
		}
	</style>
</head>

<body>
<div class="imgDIVLeft"><img src="LayoutTopMiddleAddLeft.png" width="5" height="10" alt="" border="0"></div>
<div class="imgDIVRight"><img src="LayoutTopMiddleAddRight.png" width="5" height="10" alt="" border="0"></div>
</body>
</html>
